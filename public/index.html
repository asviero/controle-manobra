<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Manobra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
            <div>
                <h2 class="mb-0">Grade de Manobra</h2>
                <small class="text-muted">Preencha os dados da operação</small>
            </div>
        </div>
        
        <button onclick="document.getElementById('btnSubmit').click()" class="btn btn-primary btn-sm d-md-none">
            Visualizar
        </button>
    </div>
    
    <form id="formManobra">
        <div id="listaTerminais" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
            <div class="col text-center p-5 text-muted">Carregando terminais...</div>
        </div>
        
        <div class="row mt-4 mb-5 g-3">
            <div class="col-md-4">
                <button type="button" class="btn btn-outline-danger w-100 py-3 fw-bold" data-bs-toggle="modal" data-bs-target="#modalConfirmacao">
                    🗑️ Apagar tudo
                </button>
            </div>
            <div class="col-md-8">
                <button type="submit" id="btnSubmit" class="btn btn-modern w-100">
                    📊 Visualizar Dados
                </button>
            </div>
        </div>
    </form>
</div>

<div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold text-danger">Atenção</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Tem certeza que deseja apagar todos os dados preenchidos até agora? Essa ação não pode ser desfeita.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" onclick="limparTudo()" data-bs-dismiss="modal">Sim, apagar tudo</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Função para limpar o formulário
    function limparTudo() {
        document.getElementById('formManobra').reset();
        localStorage.removeItem('dadosManobra'); // Limpa também o cache se tiver
    }

    async function init() {
        try {
            const res = await fetch('/api/terminais');
            const terminais = await res.json();
            const container = document.getElementById('listaTerminais');
            container.innerHTML = '';

            terminais.forEach((nome, index) => {
                const html = `
                <div class="col">
                    <div class="card-terminal">
                        <div class="card-header-custom">
                            <div class="indicator"></div>
                            <h4 title="${nome}">${nome}</h4>
                        </div>
                        
                        <div class="carga-box">
                            <input type="text" name="carga_${index}" class="form-control form-control-xs"
                            placeholder="Carregamento" style="text-align: left;">
                        </div>

                        <div class="atividade-wrapper">
                            <span class="atividade-title text-blue">⬇️ Encoste</span>
                            <div class="row g-1">
                                <div class="col-3">
                                    <label class="form-label-xs">H.Prev</label>
                                    <input type="time" name="enc_hp_${index}" class="form-control-xs">
                                </div>
                                <div class="col-3">
                                    <label class="form-label-xs">H.Real</label>
                                    <input type="time" name="enc_hr_${index}" class="form-control-xs">
                                </div>
                                <div class="col-3">
                                    <label class="form-label-xs">Vg.Prev</label>
                                    <input type="number" name="enc_vp_${index}" class="form-control-xs" placeholder="0">
                                </div>
                                <div class="col-3">
                                    <label class="form-label-xs">Vg.Real</label>
                                    <input type="number" name="enc_vr_${index}" class="form-control-xs" placeholder="0">
                                </div>
                            </div>
                        </div>

                        <div class="atividade-wrapper">
                            <span class="atividade-title text-orange">⬆️ Retirada</span>
                            <div class="row g-1">
                                <div class="col-3">
                                    <label class="form-label-xs">H.Prev</label>
                                    <input type="time" name="ret_hp_${index}" class="form-control-xs">
                                </div>
                                <div class="col-3">
                                    <label class="form-label-xs">H.Real</label>
                                    <input type="time" name="ret_hr_${index}" class="form-control-xs">
                                </div>
                                <div class="col-3">
                                    <label class="form-label-xs">Vg.Prev</label>
                                    <input type="number" name="ret_vp_${index}" class="form-control-xs" placeholder="0">
                                </div>
                                <div class="col-3">
                                    <label class="form-label-xs">Vg.Real</label>
                                    <input type="number" name="ret_vr_${index}" class="form-control-xs" placeholder="0">
                                </div>
                            </div>
                        </div>

                        <input type="hidden" name="nome_${index}" value="${nome}">
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
        } catch (e) {
            console.error(e);
            document.getElementById('listaTerminais').innerHTML = '<div class="col-12 text-danger text-center">Erro ao carregar terminais.</div>';
        }
    }

    document.getElementById('formManobra').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const formData = new FormData(e.target);
        const dadosParaEnviar = [];
        const totalTerminais = document.querySelectorAll('input[name^="nome_"]').length;

        for (let i = 0; i < totalTerminais; i++) {
            const nome = formData.get(`nome_${i}`);
            const carga = formData.get(`carga_${i}`);
            
            const encHp = formData.get(`enc_hp_${i}`);
            if(encHp) {
                dadosParaEnviar.push({
                    terminal: nome, atividade: 'Encoste',
                    hPrev: encHp, hReal: formData.get(`enc_hr_${i}`),
                    vPrev: formData.get(`enc_vp_${i}`), vReal: formData.get(`enc_vr_${i}`),
                    carga: carga
                });
            }

            const retHp = formData.get(`ret_hp_${i}`);
            if(retHp) {
                dadosParaEnviar.push({
                    terminal: nome, atividade: 'Retirada',
                    hPrev: retHp, hReal: formData.get(`ret_hr_${i}`),
                    vPrev: formData.get(`ret_vp_${i}`), vReal: formData.get(`ret_vr_${i}`),
                    carga: carga
                });
            }
        }
        
        localStorage.setItem('dadosManobra', JSON.stringify(dadosParaEnviar));
        window.location.href = 'graficos.html';
    });

    init();
</script>
</body>
</html>
