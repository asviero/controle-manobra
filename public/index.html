<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de Manobras</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
<div class="topbar-brand">
    <img src="logo.svg" alt="Logo" class="topbar-logo">
    <span class="topbar-divider"></span>
    <h1>Controle de Manobra</h1>
  </div>
  <div class="topbar-right">
    <span id="dataHoje" class="data-hoje"></span>
    <button class="btn-secondary-outline" onclick="baixarPlanilhaVazia()">⬇ Planilha campo</button>
    <button class="btn-secondary-outline" onclick="document.getElementById('importInput').click()">📂 Importar relatório</button>
    <input type="file" id="importInput" accept=".xlsx" style="display:none" onchange="importarRelatorio(this)">
    <button class="btn-danger" style="padding:7px 14px;font-size:12px;" onclick="confirmarDeletar()">🗑 Deletar dados</button>
    <button class="btn-comparar-top" onclick="irParaComparacao()">↗ Comparação</button>
  </div>
</div>

<div class="container-main">
  <div id="terminaisContainer"></div>
  <button class="btn-primary" onclick="salvarECalcular()">Calcular aderência e ver dashboard →</button>
</div>

<!-- Modal de confirmação -->
<div class="modal-overlay" id="modalDeletar">
  <div class="modal-box">
    <h5>🗑 Deletar dados do turno</h5>
    <p>Deseja apagar todos os dados do <strong id="modalTurnoNome"></strong>? Esta ação não pode ser desfeita.</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-confirm-del" onclick="executarDeletar()">Sim, deletar</button>
    </div>
  </div>
</div>

<footer>Criado por <a href="https://linkedin.com/in/asviero/" target="_blank">Angelo S. Viero</a></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const TERMINAIS = ['Yara','Bianchini','Cotribá','Ceifrago','Agrofel','Pradozem','Três Tentos','Recebimento Trem','Formação Trem'];
const MOTIVOS = [
  'Absenteísmo Rumo','Atraso de Trem','Avaria Balança Terminal','Avaria de Locomotiva',
  'Avaria Mecânica Terminal','Avaria Trator Terminal','Chuva','Falta de Energia',
  'Falta de Equipe Terminal','Manutenção Terminal','Manutenção Via Permanente',
  'Prioridade Embarque Rodoviário','Prioridade Operacional Rumo',
  'Prioridade para Descarga de Caminhões','Sem Atraso'
];

document.getElementById('dataHoje').textContent =
  new Date().toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit', year:'numeric' });

function buildCard(terminal) {
  const isRecebimento = terminal === 'Recebimento Trem';
  const isFormacao = terminal === 'Formação Trem';
  const isTrem = isRecebimento || isFormacao;

  // Define os tipos de operação baseados no terminal
  let opsHtml = isTrem 
    ? `<option value="" disabled selected>Evento</option><option>Carregado</option><option>Vazio</option>`
    : `<option value="" disabled selected>Evento</option><option>Carga</option><option>Descarga</option><option>Descarga com Reaproveitamento</option>`;

  // Define quais blocos de manobra renderizar
  let sectionsHtml = '';
  if (isRecebimento) {
    sectionsHtml = buildManobraSection(terminal, 'chegada', 'Chegada');
  } else if (isFormacao) {
    sectionsHtml = buildManobraSection(terminal, 'expedicao', 'Expedição');
  } else {
    sectionsHtml = buildManobraSection(terminal, 'encoste', 'Encoste') + buildManobraSection(terminal, 'retirada', 'Retirada');
  }

  return `
  <div class="terminal-card" id="card-${terminal}">
    <div class="terminal-title">&#9671; ${terminal}</div>
    <div class="field-row">
      <div>
        <div class="field-label">Tipo de operação</div>
        <select class="form-select form-select-sm" id="tipo-${terminal}">
          ${opsHtml}
        </select>
      </div>
      <div>
        <div class="field-label">Produto</div>
        <input type="text" class="form-control form-control-sm" id="prod-${terminal}" placeholder="Ex: Soja, Milho...">
      </div>
    </div>
    ${sectionsHtml}
  </div>`;
}

function buildManobraSection(term, tipo, label) {
  let html = `<div class="manobra-section">
    <div class="manobra-header">
      <span>${label}</span>
      <div style="display:flex;gap:5px;">
        <button class="btn-add-rem" onclick="addManobra('${term}','${tipo}')">+ adicionar</button>
        <button class="btn-add-rem" onclick="remManobra('${term}','${tipo}')">− remover</button>
      </div>
    </div>`;
  for (let i = 1; i <= 3; i++) {
    html += `<div id="man-${term}-${tipo}-${i}" ${i>1?'style="display:none"':''}>
      <div class="manobra-sub-title">${label} ${i}</div>
      <div class="row-labels"><span></span><span>Horário</span><span>Vagões</span></div>
      <div class="manobra-row">
        <label>Previsto</label>
        <input type="time" class="form-control form-control-sm" id="${tipo}-hp-${term}-${i}">
        <input type="number" class="form-control form-control-sm" id="${tipo}-vp-${term}-${i}" placeholder="0" min="0">
      </div>
      <div class="manobra-row">
        <label>Realizado</label>
        <input type="time" class="form-control form-control-sm" id="${tipo}-hr-${term}-${i}">
        <input type="number" class="form-control form-control-sm" id="${tipo}-vr-${term}-${i}" placeholder="0" min="0">
      </div>
      <div class="manobra-row">
        <label>Motivo</label>
        <select class="form-select form-select-sm" id="motivo-${term}-${tipo}-${i}" style="grid-column: span 2;">
          ${MOTIVOS.map(m=>`<option value="${m}"${m==='Sem Atraso'?' selected':''}>${m}</option>`).join('')}
        </select>
      </div>
    </div>`;
  }
  return html + '</div>';
}

function coletarDados() {
  const dados = {};
  TERMINAIS.forEach(t => {
    const manobras = [];
    ['encoste','retirada','chegada','expedicao'].forEach(tipo => {
      for (let i = 1; i <= 3; i++) {
        const el = document.getElementById(`man-${t}-${tipo}-${i}`);
        if (!el || el.style.display === 'none') continue;
        const hp = document.getElementById(`${tipo}-hp-${t}-${i}`)?.value || '';
        const vp = document.getElementById(`${tipo}-vp-${t}-${i}`)?.value || '';
        const hr = document.getElementById(`${tipo}-hr-${t}-${i}`)?.value || '';
        const vr = document.getElementById(`${tipo}-vr-${t}-${i}`)?.value || '';
        const motivo = document.getElementById(`motivo-${t}-${tipo}-${i}`)?.value || 'Sem Atraso';
        
        if (hp||vp||hr||vr||motivo!=='Sem Atraso') {
          manobras.push({ tipo, index:i, hp, vp:parseInt(vp)||0, hr, vr:parseInt(vr)||0, motivo });
        }
      }
    });
    dados[t] = {
      tipo: document.getElementById(`tipo-${t}`)?.value || '',
      produto: document.getElementById(`prod-${t}`)?.value || '',
      manobras
    };
  });
  return dados;
}

function salvarDados() {
  localStorage.setItem('dados_operacao', JSON.stringify(coletarDados()));
}

function carregarDados() {
  TERMINAIS.forEach(t => {
    const f = id => document.getElementById(id);
    if (f(`tipo-${t}`)) f(`tipo-${t}`).value = '';
    if (f(`prod-${t}`)) f(`prod-${t}`).value = '';
    
    ['encoste','retirada','chegada','expedicao'].forEach(tipo => {
      for (let i = 1; i <= 3; i++) {
        const el = f(`man-${t}-${tipo}-${i}`);
        if (el && i > 1) el.style.display = 'none';
        ['hp','vp','hr','vr'].forEach(x => { const inp = f(`${tipo}-${x}-${t}-${i}`); if(inp) inp.value=''; });
        const motInp = f(`motivo-${t}-${tipo}-${i}`); if(motInp) motInp.value = 'Sem Atraso';
      }
    });
  });
  
  const raw = localStorage.getItem('dados_operacao');
  if (!raw) return;
  const dados = JSON.parse(raw);
  
  TERMINAIS.forEach(t => {
    const d = dados[t]; if(!d) return;
    const sv = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };
    sv(`tipo-${t}`, d.tipo||''); sv(`prod-${t}`, d.produto||'');
    
    (d.manobras||[]).forEach(m => {
      const el = document.getElementById(`man-${t}-${m.tipo}-${m.index}`);
      if (el) el.style.display = '';
      sv(`${m.tipo}-hp-${t}-${m.index}`, m.hp||''); sv(`${m.tipo}-vp-${t}-${m.index}`, m.vp||'');
      sv(`${m.tipo}-hr-${t}-${m.index}`, m.hr||''); sv(`${m.tipo}-vr-${t}-${m.index}`, m.vr||'');
      sv(`motivo-${t}-${m.tipo}-${m.index}`, m.motivo||'Sem Atraso');
    });
  });
}

function addManobra(term, tipo) {
  for (let i = 2; i <= 3; i++) {
    const el = document.getElementById(`man-${term}-${tipo}-${i}`);
    if (el && el.style.display === 'none') {
      el.style.display = '';
      return;
    }
  }
}

function remManobra(term, tipo) {
  for (let i = 3; i >= 2; i--) {
    const el = document.getElementById(`man-${term}-${tipo}-${i}`);
    if (el && el.style.display !== 'none') {
      el.style.display = 'none';
      ['hp','vp','hr','vr'].forEach(f => {
        const inp = document.getElementById(`${tipo}-${f}-${term}-${i}`); 
        if(inp) inp.value = '';
      });
      const motInp = document.getElementById(`motivo-${term}-${tipo}-${i}`);
      if (motInp) motInp.value = 'Sem Atraso';
      return;
    }
  }
}

function confirmarDeletar() {
  document.getElementById('modalTurnoNome').textContent = "registro geral";
  document.getElementById('modalDeletar').classList.add('show');
}

function fecharModal() { 
  document.getElementById('modalDeletar').classList.remove('show'); 
}

function executarDeletar() { 
  localStorage.removeItem('dados_operacao'); 
  fecharModal(); 
  carregarDados(); 
}

async function importarRelatorio(input) {
  if (!input.files.length) return;
  const formData = new FormData();
  formData.append('arquivo', input.files[0]);
  try {
    const res = await fetch('/api/importar', { method:'POST', body:formData });
    if (!res.ok) throw new Error();
    const data = await res.json();
    localStorage.setItem('dados_operacao', JSON.stringify(data.terminais));
    alert(`Relatório importado com sucesso! Redirecionando para o dashboard.`);
    window.location.href = 'graficos.html';
  } catch { 
    alert('Erro ao importar. Certifique-se de que é um relatório gerado por este sistema.'); 
  }
  input.value = '';
}

function salvarECalcular() { 
  salvarDados(); 
  window.location.href = 'graficos.html'; 
}

function irParaComparacao() { 
  salvarDados(); 
  window.location.href = 'comparacao.html'; 
}

function baixarPlanilhaVazia() { 
  window.location.href = '/api/planilha-vazia'; 
}

document.getElementById('terminaisContainer').innerHTML = TERMINAIS.map(buildCard).join('');
carregarDados();
</script>
</body>
</html>
