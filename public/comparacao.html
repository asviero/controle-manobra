<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">            <button type="button" class="btn btn-comparar py-3 fw-bold px-4 shadow-sm" data-bs-toggle="modal" data-bs-target="#modalComparar">
                ⚖️ Comparar Turnos
            </button>
        </div>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparação de Turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

<div class="container py-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0 text-success">Comparativo Geral</h2>
            <small class="text-muted fw-bold">Aderência média entre Turnos</small>
        </div>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">Voltar ao Início</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4 shadow-sm border-0">
                <h5 class="text-center text-muted fw-bold mb-4">Qual turno teve a melhor performance?</h5>
                <div style="position: relative; height: 400px; width: 100%;">
                    <canvas id="chartDuelo"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="main-footer mt-5">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 text-md-start mb-2 mb-md-0">
                &copy; 2026 <strong>Controle de Manobra</strong>
            </div>
            <small class="text-muted">
                Desenvolvido por
                <a href="https://github.com/asviero/controle-manobra" target="_blank" class="text-decoration-none fw-bold">
                    Angelo S. Viero
                </a>
            </small>
        </div>
    </div>
</footer>

<script>
    function carregarComparacao() {
        const dadosStr = localStorage.getItem('dadosComparacao');
        if (!dadosStr) {
            alert("Nenhum dado encontrado.");
            window.location.href = 'index.html';
            return;
        }

        const resultados = JSON.parse(dadosStr);

        const labels = resultados.map(r => `Turno ${r.turno}`);
        const medias = resultados.map(r => r.media);

        const maiorMedia = Math.max(...medias);
        const cores = medias.map(m => m === maiorMedia ? '#ffc107' : '#0d6efd'); 

        const ctx = document.getElementById('chartDuelo').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Aderência Média Geral (%)',
                    data: medias,
                    backgroundColor: cores,
                    borderRadius: 8,
                    barPercentage: 0.6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, max: 110 } 
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.parsed.y + '% de Aderência';
                            }
                        }
                    }
                }
            }
        });
    }

    carregarComparacao();
</script>
</body>
</html>
