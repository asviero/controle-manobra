<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparação de Turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

<div class="container py-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0" style="color: #00345e;">Comparativo Geral</h2>
            <small class="text-muted fw-bold">Aderência média entre Turnos</small>
        </div>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">Voltar ao Início</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-4 shadow-sm border-0">
                <h5 class="text-center text-muted fw-bold mb-4">Qual turno teve a melhor performance?</h5>
                <div style="position: relative; height: 400px; width: 100%;">
                    <canvas id="chartDuelo"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center mt-4">
        <div class="col-lg-8">
            <div class="card p-4 shadow-sm border-0 text-center position-relative overflow-hidden" style="border-radius: 12px;">
                <div style="position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: linear-gradient(90deg, #0d6efd, #00345e);"></div>

                <h5 class="fw-bold mb-2 text-muted text-uppercase" style="letter-spacing: 1px;">
                    🎯 Aderência Geral Média
                </h5>
                <h1 class="display-3 fw-bold mb-0 text-primary" id="textoAderenciaGeral">--%</h1>
            </div>
        </div>
    </div>

    <div class="row justify-content-center mt-4 mb-5">
        <div class="col-lg-8">
            <div class="card p-4 shadow-sm border-0">
                <h6 class="text-center text-muted fw-bold mb-3">⚠️ Causas de Atraso Consolidadas (Total das Planilhas)</h6>
                <div style="position: relative; height: 250px; width: 100%;">
                    <canvas id="chartMotivosComparativo"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="main-footer mt-5">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 text-md-start mb-2 mb-md-0">
                &copy; 2026 <strong>Controle de Manobra</strong>
            </div>
            <small class="text-muted">
                Desenvolvido por
                <a href="https://www.linkedin.com/in/asviero/" target="_blank" class="text-decoration-none fw-bold">
                    Angelo S. Viero
                </a>
            </small>
        </div>
    </div>
</footer>

<script>
    function carregarComparacao() {
        const dadosStr = localStorage.getItem('dadosComparacao');
        if (!dadosStr) {
            alert("Nenhum dado encontrado.");
            window.location.href = 'index.html';
            return;
        }

        const respostaAPI = JSON.parse(dadosStr);
        const resultadosTurnos = respostaAPI.turnos;
        const motivosObj = respostaAPI.motivosConsolidados || {};

        // --- GRÁFICO 1
        const labelsTurnos = resultadosTurnos.map(r => `Turno ${r.turno}`);
        const mediasTurnos = resultadosTurnos.map(r => r.media);
        const maiorMedia = Math.max(...mediasTurnos);
        const coresTurnos = resultadosTurnos.map(r => {
            const letra = r.turno.toUpperCase();
            if (letra === 'A') return '#fd7e14';
            if (letra === 'B') return '#198754';
            if (letra === 'C') return '#0d6efd';
            return '#6c757d';
        });

        const ctx1 = document.getElementById('chartDuelo').getContext('2d');
        new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: labelsTurnos,
                datasets: [{
                    label: 'Aderência Média Geral (%)',
                    data: mediasTurnos,
                    backgroundColor: coresTurnos,
                    borderRadius: 8,
                    barPercentage: 0.6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 30 } },
                scales: { y: { beginAtZero: true, max: 110 } },
                plugins: {
                    legend: { display: false },
                    datalabels: {
                        anchor: 'end',
                        align: 'top',
                        color: '#495057',
                        font: { weight: 'bold', size: 14 },
                        formatter: function(value) {
                            return value + '%';
                        }
                    }
                }
            }
        });

        if (mediasTurnos.length > 0) {
            const somaGeral = mediasTurnos.reduce((acumulador, valorAtual) => acumulador + valorAtual, 0);
            const mediaGlobal = somaGeral / mediasTurnos.length;
            document.getElementById('textoAderenciaGeral').innerText = mediaGlobal.toFixed(1) + '%';
        }

        // --- GRÁFICO 2
        const labelsMotivos = Object.keys(motivosObj);
        const dataMotivos = Object.values(motivosObj);

        if (labelsMotivos.length === 0) {
            labelsMotivos.push("Nenhum atraso registrado nas planilhas");
            dataMotivos.push(0);
        }

        const ctx2 = document.getElementById('chartMotivosComparativo').getContext('2d');
        new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: labelsMotivos,
                datasets: [{
                    label: 'Total de Ocorrências',
                    data: dataMotivos,
                    backgroundColor: '#dc3545',
                    borderRadius: 4
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { beginAtZero: true, ticks: { stepSize: 1 } }
                },
                plugins: {
                    legend: { display: false },
                    datalabels: {
                        color: '#000',
                        anchor: 'end',
                        align: 'right',
                        font: { weight: 'bold' },
                        formatter: function(value) { return value > 0 ? value : ''; }
                    }
                }
            }
        });
    }

    if (typeof ChartDataLabels === 'undefined') {
        const script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels";
        script.onload = () => {
            Chart.register(ChartDataLabels);
            carregarComparacao();
        };
        document.head.appendChild(script);
    } else {
        Chart.register(ChartDataLabels);
        carregarComparacao();
    }
</script>
</body>
</html>
