<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analítico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">Dashboard de Resultados</h2>
            <small class="text-muted fw-bold text-primary" id="textoTurno">Análise de Performance</small>
        </div>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">Voltar / Editar</a>
    </div>

    <div class="card p-3 mb-4 shadow-sm border-0">
        <h6 class="card-title text-center text-muted fw-bold mb-3">Encoste vs Retirada</h6>
        <div style="position: relative; height: 300px; width: 100%;">
            <canvas id="chartComparativo"></canvas>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-7">
            <div class="card p-3 h-100 shadow-sm border-0">
                <h6 class="card-title text-center text-muted fw-bold mb-3">Aderência de Horário</h6>
                <div style="position: relative; height: 250px; width: 100%;">
                    <canvas id="chartHorario"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card p-3 h-100 shadow-sm border-0">
                <h6 class="card-title text-center text-muted fw-bold mb-3">Aderência por Turno</h6>
                <div style="position: relative; height: 250px; width: 100%;">
                    <canvas id="chartTurnos"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="card p-3 mb-4 shadow-sm border-0">
        <h6 class="card-title text-center text-muted fw-bold mb-3">⚠️ Principais Causas de Atraso</h6>
        <div style="position: relative; height: 200px; width: 100%;">
            <canvas id="chartAtrasos"></canvas>
        </div>
    </div>

    <div class="card p-4 mb-4 shadow-sm border-0">
        <h5 class="card-title text-muted fw-bold mb-3">📦 Detalhamento Operacional</h5>
        <div class="table-responsive">
            <table class="table table-hover align-middle" id="tabelaDetalhes">
                <thead class="table-light">
                    <tr>
                        <th>Terminal</th>
                        <th>Operação</th>
                        <th>Produto</th>
                        <th class="text-center">Aderência Geral</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

    <div class="text-center py-3">
        <button id="btnBaixarExcel" class="btn btn-success btn-lg px-5 shadow">
            📥 Baixar Planilha Excel
        </button>
    </div>
</div>

<footer class="main-footer mt-5">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 text-md-start mb-2 mb-md-0">
                &copy; 2026 <strong>Controle de Manobra</strong>
            </div>
            <small class="text-muted">
                Desenvolvido por
                <a href="https://github.com/asviero/controle-manobra" target="_blank" class="text-decoration-none fw-bold">
                    Angelo S. Viero
                </a>
            </small>
        </div>
    </div>
</footer>

<script>
    async function carregarGraficos() {
        const dadosBrutos = localStorage.getItem('dadosManobra');
        const turno = localStorage.getItem('turnoSelecionado' || '-');
        
        if (!dadosBrutos) {
            alert("Nenhum dado encontrado.");
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('textoTurno').innerText = `📊 Dados do turno ${turno}`;

        const dados = JSON.parse(dadosBrutos);

        try {
            const response = await fetch('/api/calcular', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });
            
            const resultadoAPI = await response.json();
            const terminais = resultadoAPI.terminais;
            const turnos = resultadoAPI.movimentacaoTurnos;

            const labels = terminais.map(r => r.terminal);

            const tbody = document.querySelector('#tabelaDetalhes tbody');
            tbody.innerHTML = '';

            terminais.forEach(calc => {
                const dadoOriginal = dados.find(d => d.terminal === calc.terminal);
                
                let tipoBadge = '-';
                let produtoTexto = '-';

                if (dadoOriginal && dadoOriginal.carga) {
                    const partes = dadoOriginal.carga.split(':');
                    const tipo = partes[0].trim();
                    const prod = partes[1] ? partes[1].trim() : '-';

                    if (tipo === 'Carga') {
                        tipoBadge = `<span class="badge bg-primary">CARGA</span>`;
                    } else if (tipo === 'Descarga') {
                        tipoBadge = `<span class="badge bg-success">DESCARGA</span>`;
                    } else if (tipo === 'Descarga com reaproveitamento') {
                        tipoBadge = `<span class="badge bg-warning text-dark">DESC. REAPROVEIT.</span>`;
                    } else {
                        tipoBadge = `<span class="badge bg-secondary">${tipo}</span>`;
                    }
                    produtoTexto = prod;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold text-dark">${calc.terminal}</td>
                    <td>${tipoBadge}</td>
                    <td class="text-muted fw-bold">${produtoTexto}</td>
                    <td class="text-center">
                        <span class="fw-bold ${calc.mediaEnc >= 100 && calc.mediaRet >= 100 ? 'text-success' : 'text-danger'}">
                            Encoste: ${calc.mediaEnc}% | Retirada: ${calc.mediaRet}%
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            Chart.register(ChartDataLabels);

            const dataLabelsConfig = {
                anchor: 'end',
                align: 'top',
                color: '#495057',
                font: { weight: 'bold', size: 11 },
                formatter: function(value) {
                    return value + '%';
                }
            };
            
            // GRÁFICO 1: COMPARATIVO
            const ctx1 = document.getElementById('chartComparativo').getContext('2d');
            new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Aderência Encoste',
                            data: terminais.map(r => r.mediaEnc),
                            backgroundColor: '#0d6efd',
                            borderRadius: 4
                        },
                        {
                            label: 'Aderência Retirada',
                            data: terminais.map(r => r.mediaRet),
                            backgroundColor: '#fd7e14',
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { top: 20 } },
                    scales: { y: { beginAtZero: true, max: 120 } },
                    plugins: { 
                        legend: { position: 'top' },
                        datalabels: dataLabelsConfig
                    }
                }
            });

            // GRÁFICO 2: HORÁRIO
            const ctx2 = document.getElementById('chartHorario').getContext('2d');
            new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '% Aderência Horário',
                        data: terminais.map(r => r.mediaHora),
                        backgroundColor: terminais.map(r => r.mediaHora >= 100 ? '#198754' : '#dc3545'),
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { top: 20 } },
                    scales: { y: { beginAtZero: true, max: 120 } },
                    plugins: { 
                        legend: { display: false },
                        datalabels: dataLabelsConfig
                    }
                }
            });

            // GRÁFICO 3: TURNOS
            const ctx3 = document.getElementById('chartTurnos').getContext('2d');
            new Chart(ctx3, {
                type: 'doughnut',
                data: {
                    labels: ['07h - 15h', '15h - 23h', '23h - 07h'],
                    datasets: [{
                        data: [turnos.T1, turnos.T2, turnos.T3],
                        backgroundColor: ['#ffc107', '#0dcaf0', '#6610f2'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        datalabels: {
                            color: '#fff',
                            font: { weight: 'bold', size: 14 },
                            formatter: function(value) {
                                return value > 0 ? value : '';
                            }
                        }
                    }
                }
            });

            // --- GRÁFICO 4: CAUSAS DE ATRASO
            const motivosObj = resultadoAPI.motivos;
            const labelsMotivos = Object.keys(motivosObj);
            const dataMotivos = Object.values(motivosObj);

            const ctx4 = document.getElementById('chartAtrasos').getContext('2d');
            
            if (labelsMotivos.length === 0) {
                labelsMotivos.push("Nenhum atraso registrado");
                dataMotivos.push(0);
            }

            new Chart(ctx4, {
                type: 'bar',
                data: {
                    labels: labelsMotivos,
                    datasets: [{
                        label: 'Qtd. de Ocorrências',
                        data: dataMotivos,
                        backgroundColor: '#dc3545',
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: { stepSize: 1 }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        datalabels: {
                            color: '#000',
                            align: 'right',
                            anchor: 'end',
                            font: { weight: 'bold' },
                            formatter: function(value) { return value > 0 ? value : ''; }
                        }
                    }
                }
            });

        } catch (error) {
            console.error(error);
            alert("Erro ao processar gráficos.");
        }

        // DOWNLOAD EXCEL
        document.getElementById('btnBaixarExcel').addEventListener('click', async () => {
            try {
                const res = await fetch(`/gerar?turno=${turno}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(dados)
                });
                if (res.ok) {
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Grade_Manobra_${turno}.xlsx`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                }
            } catch(err) { alert("Erro ao baixar."); }
        });
    }

    carregarGraficos();
</script>
</body>
</html>
