<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
            <div>
                <h2 class="mb-0">Dashboard de Aderência</h2>
                <small class="text-muted">Análise visual dos resultados</small>
            </div>
        </div>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">Voltar / Editar</a>
    </div>

    <div class="card p-4 mb-4 shadow-sm" style="background: white;">
        <h5 class="card-title text-center text-muted mb-4">Aderência Geral por Terminal (%)</h5>
        <div style="position: relative; height: 400px; width: 100%;">
            <canvas id="graficoAderencia"></canvas>
        </div>
    </div>

    <div class="text-center py-3">
        <button id="btnBaixarExcel" class="btn btn-success btn-lg px-5 shadow">
            📥 Baixar Planilha Excel
        </button>
    </div>
</div>

<footer class="main-footer mt-5">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6 text-md-start mb-2 mb-md-0">
                &copy; 2026 <strong>Controle de Manobra</strong>
            </div>
            <small class="text-muted">
                Desenvolvido por
                <a href="https://github.com/asviero/controle-manobra" target="_blank" class="text-decoration-none fw-bold">
                    Angelo S. Viero
                </a>
            </small>
        </div>
    </div>
</footer>

<script>
    async function carregarGraficos() {
        // 1. Recupera os dados salvos pelo index.html
        const dadosBrutos = localStorage.getItem('dadosManobra');
        
        if (!dadosBrutos) {
            alert("Nenhum dado encontrado. Por favor, preencha o formulário primeiro.");
            window.location.href = 'index.html';
            return;
        }

        const dados = JSON.parse(dadosBrutos);

        // 2. Pede ao servidor para calcular as porcentagens para o gráfico
        try {
            const response = await fetch('/api/calcular', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dados)
            });
            
            const resultados = await response.json();

            // Preparar dados para o Chart.js
            const labels = resultados.map(r => r.terminal);
            const dataGeral = resultados.map(r => r.mediaGeral);

            // Configuração do Gráfico
            const ctx = document.getElementById('graficoAderencia').getContext('2d');
            
            // Cores profissionais
            const backgroundColors = dataGeral.map(val => val >= 100 ? '#198754' : (val >= 80 ? '#ffc107' : '#dc3545'));

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '% Aderência',
                        data: dataGeral,
                        backgroundColor: backgroundColors,
                        borderRadius: 5,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 120,
                            grid: { color: '#f0f0f0' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y + '% de Aderência';
                                }
                            }
                        }
                    }
                }
            });

        } catch (error) {
            console.error("Erro ao calcular gráficos:", error);
            alert("Erro ao processar dados para o gráfico.");
        }

        // 3. Configurar o clique do botão de Download Excel
        document.getElementById('btnBaixarExcel').addEventListener('click', async () => {
            try {
                const res = await fetch('/gerar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(dados)
                });

                if (res.ok) {
                    const blob = await res.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "Grade_Manobra_Final.xlsx";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    alert("Erro ao gerar arquivo no servidor.");
                }
            } catch(err) {
                alert("Erro de conexão ao baixar.");
            }
        });
    }

    // Inicia ao carregar a página
    carregarGraficos();
</script>
</body>
</html>
